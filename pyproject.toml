[project]
name = "lockbox"
version = "0.1.0"
description = "Modern file & secret encryptor (XChaCha20-Poly1305, Argon2id, X25519, Ed25519)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyNaCl>=1.5.0", "typer>=0.12", "rich>=13"]

[project.scripts]
lockbox = "lockbox.cli:app"

[tool.ruff]
line-length = 100


[tool.mypy]
strict = true
ignore_missing_imports = true

